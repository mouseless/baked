nuxt-app" data-ssr="true" id="__NUXT_DATA__" data-src="/layers/_payload.json?_b=049eb8d9-d088-4a54-a8e4-bf336ce3aeeb">[{"state":1,"once":3,"_errors":4,"serverRendered":6,"path":7,"pinia":8,"prerenderedAt":8103},["Reactive",2],{},["Set"],["ShallowReactive",5],{},true,"\u002Flayers\u002F",["Reactive",9],{"sectionStore":10,"pageStore":625},{"sections":11},[12,56,73,90,572],{"id":13,"title":14,"extension":15,"meta":16,"path":52,"position":53,"stem":54,"__hash__":55},"sections\u002Frecipes\u002Findex.md","Recipes","md",{"body":17},{"type":18,"value":19,"toc":48},"minimark",[20,24,28,45],[21,22,14],"h1",{"id":23},"recipes",[25,26,27],"p",{},"Baked consists of many features and layers as separate packages. You are free to\nadd necessary feature and layer packages to your project and bake an application\nthat fits your needs. However, there are also architectural recipes that include\na set of layers and features with a default configuration to allow you to reuse\nwhat is commonly needed for an application.",[29,30,31,37],"blockquote",{},[25,32,33],{},[34,35,36],"span",{},"!TIP",[25,38,39,40],{},"To override a built-in configuration see\n",[41,42,44],"a",{"href":43},"..\u002Farchitecture\u002Fapplication#overriding-a-configuration","Overriding A Configuration",[25,46,47],{},"Each recipe comes with its own package that references to all the packages it\nuses. This way your application will only need to depend on one recipe package.",{"title":49,"searchDepth":50,"depth":50,"links":51},"",2,[],"\u002Frecipes",null,"recipes\u002Findex","UjXTdLiM6ZFemxLuT-7jCpXf6JUKXe_LzQO-g8WASpc",{"id":57,"title":58,"extension":15,"meta":59,"path":70,"position":53,"stem":71,"__hash__":72},"sections\u002Ffeatures\u002Findex.md","Features",{"body":60},{"type":18,"value":61,"toc":68},[62,65],[21,63,58],{"id":64},"features",[25,66,67],{},"Here you can find every feature that has been implemented in Baked.",{"title":49,"searchDepth":50,"depth":50,"links":69},[],"\u002Ffeatures","features\u002Findex","PQnbPfj892KtYM7yE4dfW4M-qhCLLVm7JlqcJouwfg0",{"id":74,"title":75,"extension":15,"meta":76,"path":87,"position":53,"stem":88,"__hash__":89},"sections\u002Flayers\u002Findex.md","Layers",{"body":77},{"type":18,"value":78,"toc":85},[79,82],[21,80,75],{"id":81},"layers",[25,83,84],{},"Here you can find documentation for every layer in Baked.",{"title":49,"searchDepth":50,"depth":50,"links":86},[],"\u002Flayers","layers\u002Findex","LJrPcCBwSS1-v1LSJsOqMiLsNyJ0l7SoPTVZfzSZI3c",{"id":91,"title":92,"extension":15,"meta":93,"path":569,"position":53,"stem":570,"__hash__":571},"sections\u002Farchitecture\u002Findex.md","Architecture",{"pages":94,"body":98},[95,96,97],"application","layer","feature",{"type":18,"value":99,"toc":561},[100,103,106,109,114,117,138,140,143,152,197,216,229,232,240,242,245,250,253,276,389,393,396,407,426,429,557],[21,101,92],{"id":102},"architecture",[25,104,105],{},"Baked has an architectural core that is designed to allow us to build software\nwith any architectural style. Core idea is to enable a good separation of\nconcerns without causing any repetitive work. To achieve this Baked breaks down\nan application into following components: domain objects, layers and features.",[25,107,108],{},"Let's dive into each type of software component to have a better understanding\nof how Baked is structured.",[110,111,113],"h2",{"id":112},"domain-objects","Domain Objects",[25,115,116],{},"At the core of an application lies its domain logic. By this we understand the\nvery reason for an application to exist. Everything else exists only to expose\nthis domain to outside world. So first component is domain objects;",[118,119,123],"pre",{"className":120,"code":121,"language":122,"meta":49,"style":49},"language-mermaid shiki shiki-themes slack-dark","flowchart\n  D((Domain\u003Cbr\u002F>Objects))\n","mermaid",[124,125,126,133],"code",{"__ignoreMap":49},[34,127,130],{"class":128,"line":129},"line",1,[34,131,132],{},"flowchart\n",[34,134,135],{"class":128,"line":50},[34,136,137],{},"  D((Domain\u003Cbr\u002F>Objects))\n",[110,139,75],{"id":81},[25,141,142],{},"Second component is layers. Every layer introduces a new technology, such as a\ndatabase server, message queue server or a framework, into your application\narchitecture.",[29,144,145,149],{},[25,146,147],{},[34,148,36],{},[25,150,151],{},"Layers are named after the concept of their technology.",[118,153,155],{"className":120,"code":154,"language":122,"meta":49,"style":49},"flowchart LR\n  HS[[HTTP\u003Cbr\u002F>Server\u003Cbr\u002F>Layer]]\n  subgraph DL[Domain Layer]\n    D((Domain\u003Cbr\u002F>Objects))\n  end\n  DA[(Data\u003Cbr\u002F>Access\u003Cbr\u002F>Layer)]\n  HS ~~~ DL ~~~ DA\n",[124,156,157,162,167,173,179,185,191],{"__ignoreMap":49},[34,158,159],{"class":128,"line":129},[34,160,161],{},"flowchart LR\n",[34,163,164],{"class":128,"line":50},[34,165,166],{},"  HS[[HTTP\u003Cbr\u002F>Server\u003Cbr\u002F>Layer]]\n",[34,168,170],{"class":128,"line":169},3,[34,171,172],{},"  subgraph DL[Domain Layer]\n",[34,174,176],{"class":128,"line":175},4,[34,177,178],{},"    D((Domain\u003Cbr\u002F>Objects))\n",[34,180,182],{"class":128,"line":181},5,[34,183,184],{},"  end\n",[34,186,188],{"class":128,"line":187},6,[34,189,190],{},"  DA[(Data\u003Cbr\u002F>Access\u003Cbr\u002F>Layer)]\n",[34,192,194],{"class":128,"line":193},7,[34,195,196],{},"  HS ~~~ DL ~~~ DA\n",[25,198,199,200,203,204,207,208,211,212,215],{},"In this example, ",[124,201,202],{},"HttpServer"," introduces the concept of web as a layer through\nthe ",[124,205,206],{},"ASP.NET Core"," technology. Also, ",[124,209,210],{},"DataAccess"," introduces the concept of\nrelational databases as a layer through the ",[124,213,214],{},"NHibernate"," framework.",[29,217,218,223],{},[25,219,220],{},[34,221,222],{},"!NOTE",[25,224,225,228],{},[124,226,227],{},"Domain"," is a unique layer that introduces the business logic of an\napplication by encapsulating its domain objects. It processes the assemblies\nto create an application schema, so that it can be used in creating\nconfiguration, conventions and\u002For generating source code.",[25,230,231],{},"For domain objects to be exposed as API endpoints or mapped onto a relational\ndatabase, layers require an insight about how to interpret domain objects.",[25,233,234,235,239],{},"This is why every layer comes with its own configuration that is specific to\nthe technology it uses. Configurations may contain a set of helper classes\nand\u002For facade methods that makes it easy to build a certain type of\nconfiguration, but they do ",[236,237,238],"strong",{},"not"," have opinions upfront.",[110,241,58],{"id":64},[25,243,244],{},"Finally, features connect layers in an opinionated way to introduce new\nbehaviours to the application. Features consist of two parts; an optional\nabstraction (port) and a required implementation (adapter).",[246,247,249],"h3",{"id":248},"abstraction","Abstraction",[25,251,252],{},"An abstraction is the library that contains all common classes, interfaces,\nattributes, if any, for a feature. It is the only accessible part of a feature\nfrom domain objects or from other feature implementations.",[29,254,255,259],{},[25,256,257],{},[34,258,222],{},[25,260,261,262,265,266,265,269,265,272,275],{},"Each feature has only one abstraction, named after the ability it provides,\ne.g. ",[124,263,264],{},"Authentication",", ",[124,267,268],{},"Lifetime",[124,270,271],{},"Logging",[124,273,274],{},"Orm"," etc.",[118,277,279],{"className":120,"code":278,"language":122,"meta":49,"style":49},"flowchart\n  subgraph Layers\n    HS[[HTTP\u003Cbr\u002F>Server\u003Cbr\u002F>Layer]]\n    subgraph DL[Domain Layer]\n      D((Domain\u003Cbr\u002F>Objects))\n    end\n    DA[(Data\u003Cbr\u002F>Access\u003Cbr\u002F>Layer)]\n  end\n\n  subgraph Features\n    subgraph Abstraction\n      A(Authentication)\n      Db(Database)\n    end\n  end\n\n  HS ~~~ A\n  D -.uses.-> A\n  D -.uses.-> Db\n  DA ~~~ Db\n",[124,280,281,285,290,295,300,305,310,315,320,326,332,338,344,350,355,360,365,371,377,383],{"__ignoreMap":49},[34,282,283],{"class":128,"line":129},[34,284,132],{},[34,286,287],{"class":128,"line":50},[34,288,289],{},"  subgraph Layers\n",[34,291,292],{"class":128,"line":169},[34,293,294],{},"    HS[[HTTP\u003Cbr\u002F>Server\u003Cbr\u002F>Layer]]\n",[34,296,297],{"class":128,"line":175},[34,298,299],{},"    subgraph DL[Domain Layer]\n",[34,301,302],{"class":128,"line":181},[34,303,304],{},"      D((Domain\u003Cbr\u002F>Objects))\n",[34,306,307],{"class":128,"line":187},[34,308,309],{},"    end\n",[34,311,312],{"class":128,"line":193},[34,313,314],{},"    DA[(Data\u003Cbr\u002F>Access\u003Cbr\u002F>Layer)]\n",[34,316,318],{"class":128,"line":317},8,[34,319,184],{},[34,321,323],{"class":128,"line":322},9,[34,324,325],{"emptyLinePlaceholder":6},"\n",[34,327,329],{"class":128,"line":328},10,[34,330,331],{},"  subgraph Features\n",[34,333,335],{"class":128,"line":334},11,[34,336,337],{},"    subgraph Abstraction\n",[34,339,341],{"class":128,"line":340},12,[34,342,343],{},"      A(Authentication)\n",[34,345,347],{"class":128,"line":346},13,[34,348,349],{},"      Db(Database)\n",[34,351,353],{"class":128,"line":352},14,[34,354,309],{},[34,356,358],{"class":128,"line":357},15,[34,359,184],{},[34,361,363],{"class":128,"line":362},16,[34,364,325],{"emptyLinePlaceholder":6},[34,366,368],{"class":128,"line":367},17,[34,369,370],{},"  HS ~~~ A\n",[34,372,374],{"class":128,"line":373},18,[34,375,376],{},"  D -.uses.-> A\n",[34,378,380],{"class":128,"line":379},19,[34,381,382],{},"  D -.uses.-> Db\n",[34,384,386],{"class":128,"line":385},20,[34,387,388],{},"  DA ~~~ Db\n",[246,390,392],{"id":391},"implementation","Implementation",[25,394,395],{},"This is the implementation part of a feature that provides concrete\nimplementations for the interfaces defined in the abstraction, along with\nopinionated configurations using the configuration API of the corresponding\nlayer(s).",[25,397,398,399,402,403,406],{},"Features may have multiple implementations, each named after its corresponding\ndesign or technology, e.g. ",[124,400,401],{},"Authentication.Jwt"," and ",[124,404,405],{},"Database.MySql",".",[29,408,409,413],{},[25,410,411],{},[34,412,36],{},[25,414,415,417,418,421,422,425],{},[124,416,268],{}," represents lifetime feature that provides an API to your domain to\nregister services in different lifetimes. ",[124,419,420],{},"Lifetime.Singleton"," and\n",[124,423,424],{},"Lifetime.Transient"," are two different implementations of how you register and\nretrieve your domain objects from dependency injection.",[25,427,428],{},"In conclusion, feature implementations serve as bridges, connecting layers to\neach other through their opinionated configurations. Below is a complete sample\narchitecture, showcasing the integration of domain logic, layers and features;",[118,430,432],{"className":120,"code":431,"language":122,"meta":49,"style":49},"flowchart TB\n  subgraph Layers\n    HS[[HTTP\u003Cbr\u002F>Server\u003Cbr\u002F>Layer]]\n    subgraph DL[Domain Layer]\n      D((Domain\u003Cbr\u002F>Objects))\n    end\n    DA[(Data\u003Cbr\u002F>Access\u003Cbr\u002F>Layer)]\n  end\n\n  subgraph Features\n    subgraph Abstraction\n      A(Authentication)\n      Db(Database)\n    end\n\n    subgraph Implementation\n      AF(Authentication.Jwt)\n      DbM(Database.MySql)\n    end\n  end\n\n  HS -.configured by.-> AF\n  A --implemented by--> AF\n  D -.uses.-> A\n  D -.uses.-> Db\n  Db --implemented by--> DbM\n  DA -.configured by.-> DbM\n",[124,433,434,439,443,447,451,455,459,463,467,471,475,479,483,487,491,495,500,505,510,514,518,523,529,535,540,545,551],{"__ignoreMap":49},[34,435,436],{"class":128,"line":129},[34,437,438],{},"flowchart TB\n",[34,440,441],{"class":128,"line":50},[34,442,289],{},[34,444,445],{"class":128,"line":169},[34,446,294],{},[34,448,449],{"class":128,"line":175},[34,450,299],{},[34,452,453],{"class":128,"line":181},[34,454,304],{},[34,456,457],{"class":128,"line":1
